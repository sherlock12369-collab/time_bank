name: 사이트 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # 사이트에는 우리집 야구만 올린다. (타임뱅크 코드는 저장소에 남아 있고, 되돌리려면 scripts/build-site.mjs + _site로)
          path: baseball
      - id: deployment
        uses: actions/deploy-pages@v4
